name: CI

on:
  push:
    branches: [master]
  pull_request:

jobs:
  check:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: denoland/setup-deno@v2
        with:
          deno-version: v2.8.3
      - name: Install dependencies
        run: deno install --allow-scripts=npm:@tailwindcss/oxide@4.1.13
      - name: Format, lint, type-check
        run: deno task check
      - name: Test
        run: deno task test
      - name: Build
        run: deno task build
