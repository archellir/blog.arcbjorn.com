<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <style>
      @font-face {
        font-family: "IBM Plex Mono";
        font-weight: 400;
        src: url("../static/fonts/ibm-plex-mono-latin-400-normal.woff2")
          format("woff2");
      }
      @font-face {
        font-family: "IBM Plex Mono";
        font-weight: 500;
        src: url("../static/fonts/ibm-plex-mono-latin-500-normal.woff2")
          format("woff2");
      }
      @font-face {
        font-family: "IBM Plex Mono";
        font-weight: 700;
        src: url("../static/fonts/ibm-plex-mono-latin-700-normal.woff2")
          format("woff2");
      }
      html, body {
        margin: 0;
      }
      body {
        box-sizing: border-box;
        width: 1200px;
        height: 630px;
        padding: 64px 80px 56px;
        display: flex;
        flex-direction: column;
        justify-content: space-between;
        background: #f9f5ef;
        color: #1b1d1e;
        font-family: "IBM Plex Mono", monospace;
        -webkit-font-smoothing: antialiased;
      }
      .brand {
        font-size: 28px;
        font-weight: 700;
      }
      .title {
        margin-top: 44px;
        font-size: 128px;
        font-weight: 500;
        line-height: 1;
        letter-spacing: -0.02em;
      }
      .lead {
        margin-top: 32px;
        max-width: 980px;
        font-size: 27px;
        line-height: 1.45;
        color: #6b6a67;
      }
      .foot {
        display: flex;
        justify-content: space-between;
        padding-top: 26px;
        border-top: 3px solid #f15025;
        font-size: 19px;
        font-weight: 500;
        letter-spacing: 0.14em;
        text-transform: uppercase;
      }
    </style>
  </head>
  <body>
    <div>
      <div class="brand">arcbjorn</div>
      <div class="title">Thoughtbook</div>
      <div class="lead">
        Explorations of system design, algorithms, math, networks, databases,
        operational systems, blockchain, programming languages &amp; patterns,
        web related tech.
      </div>
    </div>
    <div class="foot">
      <span>blog.arcbjorn.com</span>
      <span>Oleg Luganskiy</span>
    </div>
  </body>
</html>
